<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b8332a'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff' font-family='serif'%3E象%3C/text%3E%3C/svg%3E">
<title>象棋军师</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0f1115;color:#e8eaed}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 14px);
  max-width:560px;margin:0 auto;overscroll-behavior-y:contain;
}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px}
.top .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#e0a44a,#b8332a);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
canvas{display:block;width:100%;aspect-ratio:924/1024;border-radius:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.45);touch-action:manipulation}
.card{background:#191d25;border:1px solid #242a35;border-radius:12px;padding:10px;margin-top:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{
  font:inherit;font-size:14px;padding:9px 13px;border-radius:10px;border:1px solid #313949;
  background:#222833;color:#dfe4ec;cursor:pointer;flex:1 1 auto;min-width:0;white-space:nowrap;
  transition:background .12s,transform .06s;
}
button:active{transform:scale(.97);background:#2b3341}
button.primary{background:linear-gradient(135deg,#c8922f,#a8621f);border-color:#c8922f;color:#fff;font-weight:600}
button.primary:active{background:linear-gradient(135deg,#b3821f,#96541a)}
button:disabled{opacity:.45}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;background:#222833;border:1px solid #313949;font-weight:600}
.pill.red{color:#ff8a7a;border-color:#7a3a33;background:#2a1c1a}
.pill.black{color:#cbd3e0;border-color:#3a4353;background:#1d222b}
.pill.think{color:#f0c46a;border-color:#6b5326;background:#2a2417}
.muted{color:#8b93a1;font-size:13px}
.log{margin:6px 0 0;padding-left:22px;max-height:170px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.log li{font-size:14px;padding:1px 0}
.log li .r{color:#ff8a7a}.log li .b{color:#cbd3e0}
.log li .note{color:#8b93a1;font-size:12px}
.aiout{margin-top:9px;font-size:14px;color:#cfd6e2;white-space:pre-wrap;word-break:break-word;
  max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.aiout:empty{display:none}
.aiout b{color:#f0c46a}
details.card summary{cursor:pointer;font-weight:600;list-style:none;font-size:14px}
details.card summary::-webkit-details-marker{display:none}
details.card summary:before{content:"⚙ ";opacity:.7}
details.card[open] summary{margin-bottom:8px}
label.f{display:block;margin-top:9px;font-size:13px;color:#9aa3b2}
input[type=text],input[type=password],input[type=number],select{
  font:inherit;font-size:14px;width:100%;margin-top:4px;padding:9px 10px;border-radius:9px;
  border:1px solid #313949;background:#12161d;color:#e8eaed;-webkit-appearance:none;appearance:none}
select{background-image:none}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:#9aa3b2;margin-left:auto}
.sw input{width:18px;height:18px;accent-color:#c8922f;margin:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(20px);
  background:rgba(30,36,46,.97);border:1px solid #3a4353;color:#e8eaed;padding:9px 15px;border-radius:999px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #f0c46a;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 摆棋面板 */
#setupPanel{display:none}
#setupPanel.on{display:block}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.pal{aspect-ratio:1;border-radius:9px;border:1px solid #313949;background:#12161d;color:#dfe4ec;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:pointer;
  font-family:"Songti SC","STSong",serif;padding:0;min-width:0}
.pal.red{color:#ff8a7a}
.pal.on{background:#c8922f;border-color:#e0a44a;color:#fff}
.pal.wide{grid-column:span 2;font-size:13px;font-family:inherit}
.banner{background:#2a2417;border:1px solid #6b5326;color:#f0c46a;border-radius:10px;
  padding:8px 10px;font-size:13.5px;margin-top:8px}
</style>
</head>
<body>

<div class="top">
  <div class="logo">象</div>
  <h1>象棋军师</h1>
</div>

<canvas id="board"></canvas>

<div class="card">
  <div class="row">
    <span class="pill" id="turnPill">—</span>
    <span class="muted" id="hintText"></span>
  </div>
</div>

<div class="card">
  <div class="btns">
    <button id="btnNew">新开一局</button>
    <button id="btnUndo">悔棋</button>
    <button id="btnFlip">翻转视角</button>
  </div>
  <div class="btns">
    <button id="btnSetup">摆棋模式</button>
  </div>
</div>

<div class="card" id="setupPanel">
  <div class="row"><b>摆棋模式</b><span class="muted" id="setupTip"></span></div>
  <div class="muted" style="margin-top:6px">选一枚棋子放到棋盘上；选「擦除」再点棋盘可删子。摆好后点「摆好了，开始」。</div>
  <div class="palette" id="palette"></div>
  <div class="btns">
    <button id="btnSetupClear">清空棋盘</button>
    <button id="btnSetupStart" class="primary">摆好了，开始</button>
    <button id="btnSetupCancel">退出摆棋</button>
  </div>
</div>

<div class="card">
  <div class="row">
    <b>军师</b>
    <label class="sw"><input type="checkbox" id="autoAI"> 自动走子</label>
  </div>
  <div class="btns">
    <button id="btnThink" class="primary">让军师想一步</button>
  </div>
  <div class="btns">
    <button id="btnExplain">讲解局面</button>
    <button id="btnPhoto">拍照录入</button>
  </div>
  <div class="muted" style="margin-top:6px;font-size:12.5px">
    走棋由<b>内置引擎</b>完成：不联网、不花 token、约 1 秒出招。
    「讲解局面」和「拍照录入」才需要联网和 API Key。
  </div>
  <div id="aiOut" class="aiout"></div>
</div>

<div class="card">
  <div class="row"><b>记谱</b><span class="muted" id="logHint"></span></div>
  <ol class="log" id="log"></ol>
</div>

<details class="card">
  <summary>设置</summary>
  <label class="f">军师执哪一方（＝你现实中执的一方）</label>
  <select id="setSide">
    <option value="RED">红方（你执红先手，军师帮你走红）</option>
    <option value="BLACK">黑方（你执黑后手，军师帮你走黑）</option>
  </select>
  <label class="f">军师引擎（棋力差距巨大）</label>
  <select id="setEngine">
    <option value="js">内置轻量引擎 —— 秒出、离线、深度 6~7 层</option>
    <option value="pika">Pikafish 超人类引擎 —— 深度 14+ 层（首次需下载 18MB，之后本地缓存）</option>
  </select>
  <div class="muted" id="pikaStatus" style="font-size:12.5px;margin-top:4px"></div>
  <label class="f">军师棋力（越强越慢；不花 token）</label>
  <select id="setStrength">
    <option value="400">快 —— 0.4 秒/步</option>
    <option value="1200">标准 —— 1.2 秒/步（推荐）</option>
    <option value="2500">强 —— 2.5 秒/步</option>
    <option value="5000">很强 —— 5 秒/步</option>
  </select>
  <div class="muted" style="margin-top:10px;font-size:12.5px">
    以下 API 设置<b>只有</b>「拍照识别」和「讲解局面」才需要，走棋完全不需要。
    不填也能正常对弈。
  </div>
  <label class="f">API Key（只存在你手机浏览器本地，不会上传）</label>
  <input type="password" id="setKey" placeholder="sk-...（可留空）" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label class="f">接口地址（OpenAI 兼容）</label>
  <input type="text" id="setBase" value="https://api.deepseek.com" autocapitalize="off" spellcheck="false">
  <label class="f">文字模型（讲解用，纯文本即可）</label>
  <input type="text" id="setModel" value="deepseek-flash" autocapitalize="off" spellcheck="false">
  <label class="f">看图模型（拍照识别用，必须支持图像）</label>
  <input type="text" id="setVision" placeholder="例如 deepseek-flash" autocapitalize="off" spellcheck="false">
  <div class="btns">
    <button id="btnTest">测试连接</button>
    <button id="btnClearLog">清空记谱</button>
  </div>
  <div class="btns">
    <button id="btnRemember">把 Key 存进书签（免重填）</button>
  </div>
  <div class="muted" style="margin-top:6px;font-size:12.5px">
    iPhone 的 Safari 会定期清理网页存储，所以 Key 可能丢失。点上面这个按钮会生成一条
    带 Key 的网址，把它存成书签，以后从书签打开就永远不用再填。
  </div>
  <div id="rememberOut" class="aiout" style="font-size:12.5px"></div>
</details>

<input type="file" id="fileInput" accept="image/*" hidden>
<div id="toast"></div>

<script>
/* 中国象棋搜索引擎（浏览器/Node 通用）
   棋盘：90 格，idx = y*9+x ；y=0 黑方底线，y=9 红方底线
   棋子：1..7 红(K,A,B,N,R,C,P)，8..14 黑(K,A,B,N,R,C,P)，0 空

const RED = 1, BLACK = 2;

const BK=8,BA=9,BB=10,BN=11,BR=12,BC=13,BP=14;

const isRed = p => p >= 1 && p <= 7;
const isBlack = p => p >= 8 && p <= 14;
const sideOf = p => (p === 0 ? 0 : (p <= 7 ? RED : BLACK));

const inBoard = (x, y) => x >= 0 && x <= 8 && y >= 0 && y <= 9;
const inPalace = (x, y, side) => x >= 3 && x <= 5 && (side === RED ? (y >= 7 && y <= 9) : (y >= 0 && y <= 2));

/* ---------------- 局面 ---------------- */
function newBoard() { return new Int8Array(90); }

function boardFromFen(fen) {
  const b = newBoard();
  const rows = String(fen).trim().split(/\s+/)[0].split('/');
  for (let y = 0; y < 10; y++) {
    let x = 0;
    for (const ch of rows[y]) {

      const pc = b[y * 9 + x];

/* ---------------- 走法生成 ---------------- */
const KNIGHT = [ // [dx,dy] 马到目标格的位移，[lx,ly] 从马出发的蹩腿偏移
  [1,2,0,1],[2,1,1,0],[2,-1,1,0],[1,-2,0,-1],
  [-1,-2,0,-1],[-2,-1,-1,0],[-2,1,-1,0],[-1,2,0,1]
];

function genMoves(b, side, out) {
  out.length = 0;
  for (let i = 0; i < 90; i++) {
    const pc = b[i];
    if (!pc || sideOf(pc) !== side) continue;
    const x = i % 9, y = (i - x) / 9, t = typeOf(pc);

    if (t === 5) {                                   // 车
      for (let d = 0; d < 4; d++) {
        const dx = d === 0 ? 1 : d === 1 ? -1 : 0;
        const dy = d === 2 ? 1 : d === 3 ? -1 : 0;

        }
      }
    } else if (t === 6) {                            // 炮

        const dy = d === 2 ? 1 : d === 3 ? -1 : 0;

      }

      }

        if (!q || sideOf(q) !== side) out.push(i, ny * 9 + nx);
      }

      }

        for (let dx = -1; dx <= 1; dx += 2) {
          const nx = x + dx;
          if (!inBoard(nx, y)) continue;

/* ---------------- 将军 / 合法性 ---------------- */
function isAttacked(b, x, y, side) {

  // 蹩腿点 = 马朝王方向、位移较大那一轴上的相邻格
  for (let k = 0; k < 8; k++) {

    const hx = x + dx, hy = y + dy;

    const q = b[hy * 9 + hx];

    const ly = (dy === 2 || dy === -2) ? hy - dy / 2 : hy;

  const k = side === RED ? RK : BK;
  for (let i = 0; i < 90; i++) if (b[i] === k) return i;

// 生成合法着法，写入 out（每两个一组 from,to）
function genLegal(b, side, out) {
  const pseudo = [];
  genMoves(b, side, pseudo);
  out.length = 0;
  for (let i = 0; i < pseudo.length; i += 2) {
    const from = pseudo[i], to = pseudo[i + 1];
    const cap = b[to];
    b[to] = b[from]; b[from] = 0;
    const ok = kingSafe(b, side);
    b[from] = b[to]; b[to] = cap;
    if (ok) out.push(from, to);

  const b = boardFromFen(fen);
  const side = sideFromFen(fen);
  const mv = [];
  genLegal(b, side, mv);
  const res = [];
  for (let i = 0; i < mv.length; i += 2) {
    res.push({ from: { x: mv[i] % 9, y: Math.floor(mv[i] / 9) },

}

/* ---------------- 评估 ---------------- */
// 子力价值（标准比例，×100 便于整数运算）
// 索引 = 棋子类型：1帅 2仕 3相 4马 5车 6炮 7兵

    case 4:  // 马：占中路、过河好；边上差

    case 6:  // 炮：占中路好（不奖励盲目前推）

function evaluate(b) {
  let s = 0;
  for (let i = 0; i < 90; i++) {
    const pc = b[i];
    if (!pc) continue;
    const x = i % 9, y = (i - x) / 9, t = typeOf(pc), sd = sideOf(pc);
    const v = VAL[t] + pst(t, x, y, sd);
    s += (sd === RED ? v : -v);

/* ---------------- 搜索 ---------------- */
const MATE = 1000000;
const MAX_PLY = 64;

function Searcher() {
  this.nodes = 0;
  this.killer = [];               // killer[ply] = [move1, move2]

  this.startTime = 0;

  this.stop = false;

Searcher.prototype.ab = function (b, side, depth, alpha, beta, ply) {

  this.orderMoves(b, mv, ply);
  const n = mv.length / 2;
  let best = -Infinity;
  for (let i = 0; i < n; i++) {
    const from = mv[i * 2], to = mv[i * 2 + 1];
    const cap = b[to];
    b[to] = b[from]; b[from] = 0;
    const sc = -this.ab(b, other(side), depth - 1, -beta, -alpha, ply + 1);
    b[from] = b[to]; b[to] = cap;
    if (this.stop) return best === -Infinity ? alpha : best;
    if (sc > best) best = sc;
    if (sc > alpha) {
      alpha = sc;
      if (!cap) this.history[from * 90 + to] += depth * depth;
    }
    if (alpha >= beta) {
      if (!cap) {
        const k = this.killer[ply] || (this.killer[ply] = [0, 0]);
        const mvIdx = from * 90 + to;
        if (k[0] !== mvIdx) { k[1] = k[0]; k[0] = mvIdx; }
      }
      return beta;
    }
  }
  return best;
};

// 迭代加深，返回最佳着法
// avoid: 可选，Set<局面key>，命中则该着法降权（避免来回循环）
Searcher.prototype.search = function (fen, maxDepth, timeMs, avoid) {
  const b = boardFromFen(fen);
  const side = sideFromFen(fen);
  this.nodes = 0; this.stop = false;
  this.killer = []; this.history = new Int32Array(90 * 90);
  this.startTime = Date.now();
  this.timeLimit = timeMs || 1e9;

  const root = [];
  genLegal(b, side, root);
  if (root.length === 0) return null;

  const REPEAT_PENALTY = PAWN * 20;   // 重复局面惩罚

  let best = { from: root[0], to: root[1], score: 0, depth: 0 };
  const n = root.length / 2;
  const arr = new Array(n);
  for (let i = 0; i < n; i++) {
    const from = root[i * 2], to = root[i * 2 + 1];
    arr[i] = { from, to, s: this.scoreMove(b, from, to, 0) };
  }
  arr.sort((a, c) => c.s - a.s);

  for (let d = 1; d <= maxDepth; d++) {
    let alpha = -Infinity, localBest = null;
    for (let i = 0; i < n; i++) {
      const from = arr[i].from, to = arr[i].to;
      const cap = b[to];
      b[to] = b[from]; b[from] = 0;
      let sc = -this.ab(b, other(side), d - 1, -Infinity, -alpha, 1);
      if (avoid && avoid.size) {
        const key = fenFromBoard(b, other(side));
        if (avoid.has(key)) sc -= REPEAT_PENALTY;
      }
      b[from] = b[to]; b[to] = cap;
      if (this.stop) break;
      if (localBest === null || sc > localBest.score) {
        localBest = { from, to, score: sc };
        if (sc > alpha) alpha = sc;
      }
    }
    if (localBest) {
      best = { from: localBest.from, to: localBest.to, score: localBest.score, depth: d };
      const idx = arr.findIndex(a => a.from === best.from && a.to === best.to);
      if (idx > 0) { const t = arr[idx]; arr.splice(idx, 1); arr.unshift(t); }
    }
    if (this.stop) break;
    if (Math.abs(best.score) > MATE - 1000) break;   // 已找到杀棋
  }
  return {
    from: { x: best.from % 9, y: Math.floor(best.from / 9) },
    to:   { x: best.to % 9,   y: Math.floor(best.to / 9) },
    score: best.score, depth: best.depth,
    nodes: this.nodes, ms: Date.now() - this.startTime
  };
};

function search(fen, opts) {
  opts = opts || {};
  const s = new Searcher();
  return s.search(fen, opts.depth || 6, opts.timeMs || 2500, opts.avoid);
}

return {
  RED, BLACK, MATE, VAL,
  boardFromFen, fenFromBoard, sideFromFen,
  genMoves, genLegal, legalMovesOfFen, isAttacked, kingSafe, findKing,
  evaluate, search, Searcher,
  typeOf, sideOf, PC2CHAR, CHAR2PC
};
}));

<script>
"use strict";
(function(){
const $ = id => document.getElementById(id);
const canvas = $('board');
// 规则库以 UMD 形式挂到 window.ZhChess，真正的类是它的 default 导出
const LIB = window.ZhChess || {};
const ZhChess = LIB.default || LIB;
const Engine = window.XQEngine;

/* ============================ 常量与工具 ============================ */
const SIDES = { RED:'RED', BLACK:'BLACK' };
const CN_SIDE = { RED:'红方', BLACK:'黑方' };
const other = s => s === 'RED' ? 'BLACK' : 'RED';
const CN_NUM = ['一','二','三','四','五','六','七','八','九'];
const AR_NUM = ['1','2','3','4','5','6','7','8','9'];
const INIT_FEN = 'rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR';
const LETTER_NAME = {
  'K':'帅','A':'仕','B':'相','N':'马','R':'车','C':'炮','P':'兵',
  'k':'将','a':'士','b':'象','n':'馬','r':'車','c':'砲','p':'卒'
};
const PALETTE = ['R','N','B','A','K','C','P','r','n','b','a','k','c','p',''];

/* ============================ 应用状态 ============================ */
const S = {
  game: null,
  turn: 'RED',
  aiSide: 'RED',         // 军师执的一方（也是你在现实中执的一方）
  flipped: false,        // 是否翻转视角（true 表示红方在下）
  selected: null,
  lastMove: null,
  suggest: null,         // {from,to,reason}
  thinking: false,
  autoAI: false,
  history: [],           // {fen, side, notation, captured, lastMove}
  apiKey: '', model: 'deepseek-flash', visionModel: '', baseUrl: 'https://api.deepseek.com',
  engineMs: 1200,        // 内置引擎每步思考时间（毫秒）
  engineType: 'js',      // 'js' 内置轻量引擎 | 'pika' Pikafish WASM
  wantReason: false,     // 是否让大模型额外补充讲解
  pendingCapture: 'environment',
  hasFlipCfg: false,
  setupMode: false,      // 摆棋模式
  setupBoard: null,      // 摆棋用的 90 格数组
  setupBrush: 'R'        // 当前画笔：棋子字母 或 '' (擦除)
};

/* ============================ 配置持久化（三层，防 iOS 清存储） ============================ */
const CFG_KEY = 'xq_cfg';
let idbReady = null;

// 第 2 层：IndexedDB（比 localStorage 更耐 iOS 清理）
function idbOpen(){
  if(idbReady) return idbReady;
  idbReady = new Promise((res)=>{
    try{
      const req = indexedDB.open('xiangqi', 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>res(null);
      setTimeout(()=>res(null), 1500);
    }catch(e){ res(null); }
  });
  return idbReady;
}
async function idbSet(k, v){
  const db = await idbOpen(); if(!db) return;
  try{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(v, k);
  }catch(e){}
}
async function idbGet(k){
  const db = await idbOpen(); if(!db) return null;
  return new Promise((res)=>{
    try{
      const tx = db.transaction('kv','readonly');
      const rq = tx.objectStore('kv').get(k);
      rq.onsuccess = ()=>res(rq.result || null);
      rq.onerror = ()=>res(null);
      setTimeout(()=>res(null), 1500);
    }catch(e){ res(null); }
  });
}

// 第 3 层：URL hash（#k=...），存进书签就永久保留
function keyFromHash(){
  try{
    const m = location.hash.match(/[#&]k=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }catch(e){ return ''; }
}

function cfgObject(){
  return { apiKey:S.apiKey, model:S.model, visionModel:S.visionModel, baseUrl:S.baseUrl,
           aiSide:S.aiSide, autoAI:S.autoAI, flipped:S.flipped,
           engineMs:S.engineMs, wantReason:S.wantReason, engineType:S.engineType };
}
function saveCfg(){
  const o = cfgObject();
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(o)); }catch(e){}
  idbSet(CFG_KEY, o);                       // 异步备份
}
function applyCfg(c){
  if(!c) return;
  if(c.apiKey) S.apiKey = c.apiKey;
  if(c.model) S.model = c.model;
  if(typeof c.visionModel === 'string') S.visionModel = c.visionModel;
  if(c.baseUrl) S.baseUrl = c.baseUrl;
  if(c.aiSide) S.aiSide = c.aiSide;
  if(typeof c.autoAI === 'boolean') S.autoAI = c.autoAI;
  if(typeof c.flipped === 'boolean'){ S.flipped = c.flipped; S.hasFlipCfg = true; }
  if(typeof c.engineMs === 'number') S.engineMs = c.engineMs;
  if(c.engineType === 'js' || c.engineType === 'pika') S.engineType = c.engineType;
  if(typeof c.wantReason === 'boolean') S.wantReason = c.wantReason;
}
function loadCfgSync(){
  try{ applyCfg(JSON.parse(localStorage.getItem(CFG_KEY) || 'null')); }catch(e){}
  const hk = keyFromHash();
  if(hk) S.apiKey = hk;                     // hash 优先级最高
}
async function loadCfgAsync(){
  if(S.apiKey) return;                      // 已有就不用找了
  const c = await idbGet(CFG_KEY);
  if(c && c.apiKey){ applyCfg(c); if($('setKey')) $('setKey').value = S.apiKey; }
}
// 让「军师执的一方」默认显示在下方
function orientToAiSide(){
  S.flipped = (S.aiSide === 'BLACK');
  saveCfg();
}

/* ============================ 提示条 ============================ */
let toastTimer = null;
function toast(msg, ms){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), ms||2200);
}

/* ============================ 棋盘绘制 ============================ */
function metrics(){
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const pad = W * 0.058;
  const cw = (W - 2*pad) / 8;
  const ch = (H - 2*pad) / 9;
  return { W, H, pad, cw, ch };
}
// 逻辑坐标 (x:0..8, y:0..9) -> 屏幕坐标；支持翻转视角
function makeMapper(m){
  return {
    X(x){ const xx = S.flipped ? 8-x : x; return m.pad + xx*m.cw; },
    Y(y){ const yy = S.flipped ? 9-y : y; return m.pad + yy*m.ch; }
  };
}
// 屏幕点 -> 逻辑坐标
function screenToLogic(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  const m = metrics();
  const sx = (clientX - r.left) * (m.W / r.width);
  const sy = (clientY - r.top)  * (m.H / r.height);
  const rx = (sx - m.pad) / m.cw, ry = (sy - m.pad) / m.ch;
  let x = Math.round(rx), y = Math.round(ry);
  if(S.flipped){ x = 8-x; y = 9-y; }
  if(x<0||x>8||y<0||y>9) return null;
  const mp = makeMapper(m);
  const dx = sx - mp.X(x), dy = sy - mp.Y(y);
  if(Math.hypot(dx,dy) > Math.min(m.cw,m.ch)*0.62) return null;
  return { x, y };
}

function render(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if(!W || !H) return;
  const bw = Math.round(W*dpr), bh = Math.round(H*dpr);
  if(canvas.width !== bw || canvas.height !== bh){ canvas.width = bw; canvas.height = bh; }
  const g = canvas.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);

  const m = metrics(); const M = makeMapper(m);
  const X = M.X, Y = M.Y;

  // 木质背景
  const grad = g.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#f0d9a8'); grad.addColorStop(.55,'#e9cd97'); grad.addColorStop(1,'#dcbb80');
  g.fillStyle = grad; g.fillRect(0,0,W,H);

  // 网格
  g.strokeStyle = 'rgba(90,64,32,.85)';
  g.lineWidth = Math.max(1, m.cw*0.022);
  g.lineCap = 'round';
  for(let y=0;y<=9;y++){
    g.beginPath(); g.moveTo(X(0),Y(y)); g.lineTo(X(8),Y(y)); g.stroke();
  }
  for(let x=0;x<=8;x++){
    if(x===0 || x===8){
      g.beginPath(); g.moveTo(X(x),Y(0)); g.lineTo(X(x),Y(9)); g.stroke();
    }else{
      g.beginPath(); g.moveTo(X(x),Y(0)); g.lineTo(X(x),Y(4)); g.stroke();
      g.beginPath(); g.moveTo(X(x),Y(5)); g.lineTo(X(x),Y(9)); g.stroke();
    }
  }
  // 九宫斜线
  g.beginPath();
  g.moveTo(X(3),Y(0)); g.lineTo(X(5),Y(2));
  g.moveTo(X(5),Y(0)); g.lineTo(X(3),Y(2));
  g.moveTo(X(3),Y(7)); g.lineTo(X(5),Y(9));
  g.moveTo(X(5),Y(7)); g.lineTo(X(3),Y(9));
  g.stroke();
  // 外框
  g.lineWidth = Math.max(2, m.cw*0.045);
  g.strokeRect(X(0),Y(0),X(8)-X(0),Y(9)-Y(0));

  // 楚河汉界
  g.save();
  g.fillStyle = 'rgba(96,68,34,.72)';
  g.font = '600 ' + (m.cw*0.60).toFixed(1) + 'px "Songti SC","STSong",serif';
  g.textAlign='center'; g.textBaseline='middle';
  const ry1 = (Y(4)+Y(5))/2;
  g.fillText('楚  河', (X(1)+X(3))/2, ry1);
  g.fillText('漢  界', (X(5)+X(7))/2, ry1);
  g.restore();

  // 上一步高亮（摆棋模式不显示）
  if(S.lastMove && !S.setupMode){
    g.save();
    g.strokeStyle = 'rgba(214,120,40,.95)'; g.lineWidth = Math.max(2, m.cw*0.06);
    [S.lastMove.from, S.lastMove.to].forEach(p=>{
      const r = Math.min(m.cw,m.ch)*0.47;
      g.beginPath(); g.arc(X(p.x),Y(p.y), r, 0, Math.PI*2); g.stroke();
    });
    g.restore();
  }

  // 军师建议高亮
  if(S.suggest && !S.setupMode){
    g.save();
    g.strokeStyle = 'rgba(60,170,110,.95)'; g.lineWidth = Math.max(2, m.cw*0.055);
    [S.suggest.from, S.suggest.to].forEach(p=>{
      const r = Math.min(m.cw,m.ch)*0.5;
      g.beginPath(); g.arc(X(p.x),Y(p.y), r, 0, Math.PI*2); g.stroke();
    });
    g.setLineDash([m.cw*0.12, m.cw*0.12]);
    g.strokeStyle = 'rgba(60,170,110,.9)'; g.lineWidth = Math.max(2, m.cw*0.045);
    g.beginPath(); g.moveTo(X(S.suggest.from.x),Y(S.suggest.from.y));
    g.lineTo(X(S.suggest.to.x),Y(S.suggest.to.y)); g.stroke();
    g.restore();
  }

  // 选中与可走点
  if(S.selected && !S.setupMode){
    const moves = legalMoves(S.turn).filter(mv => mv.from.x===S.selected.x && mv.from.y===S.selected.y);
    g.save();
    moves.forEach(mv=>{
      const cx = X(mv.to.x), cy = Y(mv.to.y);
      const occupied = !!pieceAt(mv.to.x, mv.to.y);
      g.beginPath();
      g.arc(cx, cy, Math.min(m.cw,m.ch)*(occupied?0.46:0.17), 0, Math.PI*2);
      if(occupied){ g.strokeStyle='rgba(200,60,50,.85)'; g.lineWidth=Math.max(2,m.cw*0.055); g.stroke(); }
      else { g.fillStyle='rgba(40,140,90,.55)'; g.fill(); }
    });
    g.restore();
  }

  // 棋子（摆棋模式下画的是摆棋板）
  let drawList = [];
  if(S.setupMode && S.setupBoard){
    for(let i=0;i<90;i++){
      const ch = S.setupBoard[i];
      if(!ch) continue;
      drawList.push({ x:i%9, y:Math.floor(i/9), name:LETTER_NAME[ch] || ch,
                      side: (ch === ch.toUpperCase() ? 'RED' : 'BLACK') });
    }
  }else if(S.game){
    drawList = S.game.currentLivePieceList;
  }
  for(const p of drawList){
    const cx = X(p.x), cy = Y(p.y), r = Math.min(m.cw,m.ch)*0.435;
    g.beginPath(); g.arc(cx, cy + r*0.07, r, 0, Math.PI*2);
    g.fillStyle = 'rgba(70,45,20,.28)'; g.fill();

    const bg = g.createRadialGradient(cx-r*0.32, cy-r*0.38, r*0.08, cx, cy, r*1.05);
    bg.addColorStop(0,'#fffef8'); bg.addColorStop(.7,'#f7ecd2'); bg.addColorStop(1,'#e6d3aa');
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.fillStyle=bg; g.fill();

    const line = p.side==='RED' ? '#b8332a' : '#25272b';
    g.strokeStyle = line; g.lineWidth = Math.max(1.2, r*0.085); g.stroke();
    g.beginPath(); g.arc(cx,cy,r*0.83,0,Math.PI*2);
    g.lineWidth = Math.max(.7, r*0.045); g.stroke();

    g.fillStyle = line;
    g.font = '700 ' + (r*1.15).toFixed(1) + 'px "Songti SC","STSong","SimSun",serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(p.name, cx, cy + r*0.04);

    if(S.selected && S.selected.x===p.x && S.selected.y===p.y){
      g.beginPath(); g.arc(cx,cy,r*1.06,0,Math.PI*2);
      g.strokeStyle = '#e0a44a'; g.lineWidth = Math.max(2.4, r*0.13); g.stroke();
    }
  }
}

/* ============================ 局面查询 ============================ */
function pieceAt(x,y){
  if(!S.game) return null;
  return S.game.currentLivePieceList.find(p => p.x===x && p.y===y) || null;
}
function generalOf(side){
  if(!S.game) return null;
  return S.game.currentLivePieceList.find(p => p.side===side &&
    (p.name==='帅' || p.name==='将')) || null;
}
// 生成 side 一方的合法着法（临时把库的「当前走子方」切过去，用完还原）
function legalMoves(side){
  if(!S.game) return [];
  const cur = S.turn;
  try{
    if(cur !== side) S.game.changeCurrentPlaySide(side);
    return S.game.generateLegalMoves(side) || [];
  }catch(e){
    return [];
  }finally{
    try{ if(cur !== side) S.game.changeCurrentPlaySide(cur); }catch(e){}
  }
}
function isLegal(from,to){
  return legalMoves(S.turn).some(mv => mv.from.x===from.x && mv.from.y===from.y && mv.to.x===to.x && mv.to.y===to.y);
}
function currentFen(){ return S.game.getCurrentPenCode(S.turn); }

/* ============================ 摆棋模式 ============================ */
function setupEnter(){
  S.setupMode = true;
  S.selected = null; S.suggest = null; S.lastMove = null;
  S.setupBoard = new Array(90).fill('');
  if(S.game){
    for(const p of S.game.currentLivePieceList){
      const ch = Object.keys(LETTER_NAME).find(k => LETTER_NAME[k] === p.name);
      if(ch) S.setupBoard[p.y*9 + p.x] = ch;
    }
  }
  S.setupBrush = 'R';
  $('setupPanel').classList.add('on');
  buildPalette();
  render(); refreshUI();
  toast('摆棋模式：先选棋子，再点棋盘落子');
}
function setupExit(){ S.setupMode = false; $('setupPanel').classList.remove('on'); render(); refreshUI(); }
function buildPalette(){
  const box = $('palette');
  box.innerHTML = '';
  PALETTE.forEach(ch=>{
    const b = document.createElement('button');
    b.className = 'pal ' + (ch && ch === ch.toUpperCase() ? 'red' : '') +
                  (S.setupBrush === ch ? ' on' : '') + (ch === '' ? ' wide' : '');
    b.textContent = ch === '' ? '擦除' : LETTER_NAME[ch];
    b.onclick = ()=>{ S.setupBrush = ch; buildPalette(); };
    box.appendChild(b);
  });
}
function setupPut(x,y){
  S.setupBoard[y*9 + x] = S.setupBrush;
  render();
}
function setupBoardToFen(){
  const rows = [];
  for(let y=0;y<10;y++){
    let s = '', n = 0;
    for(let x=0;x<9;x++){
      const ch = S.setupBoard[y*9 + x];
      if(!ch){ n++; continue; }
      if(n){ s += n; n = 0; }
      s += ch;
    }
    if(n) s += n;
    rows.push(s);
  }
  return rows.join('/');
}
function setupStart(){
  const fen = setupBoardToFen();
  const v = validateFen(fen + ' w');
  if(!v.ok){ toast('还不能开始：' + v.msg, 3500); return; }
  S.game.setPenCodeList(fen + ' ' + (S.turn === 'RED' ? 'w' : 'b'));
  S.game.changeCurrentPlaySide(S.turn);
  S.history = []; S.lastMove = null; S.suggest = null; S.selected = null;
  $('aiOut').innerHTML = '';
  setupExit();
  toast('局面已载入，可以开始对局了');
}

/* ============================ 中文记谱 ============================ */
function notate(from, to){
  const p = pieceAt(from.x, from.y);
  if(!p) return '';
  const side = p.side;
  const nums = side==='RED' ? CN_NUM : AR_NUM;
  const name = p.name;

  // 同一纵线上有多个同名子 -> 用 前/后
  const sameFile = S.game.currentLivePieceList
    .filter(q => q.side===side && q.name===name && q.x===from.x)
    .sort((a,b) => side==='RED' ? a.y-b.y : b.y-a.y);  // 靠近敌方者为「前」
  let prefix = '';
  let filePart;
  if(sameFile.length >= 2){
    const idx = sameFile.findIndex(q => q.y===from.y);
    if(sameFile.length === 2) prefix = idx===0 ? '前' : '后';
    else if(sameFile.length === 3) prefix = ['前','中','后'][idx];
    else prefix = ['前','二','三','四','五'][idx] || '前';
    filePart = name;
  }else{
    const fileNo = side==='RED' ? (9-from.x) : (from.x+1);
    filePart = name + nums[fileNo-1];
  }

  let action, target;
  if(to.y === from.y){
    action = '平';
    target = nums[(side==='RED' ? (9-to.x) : (to.x+1)) - 1];
  }else{
    const forward = side==='RED' ? (to.y < from.y) : (to.y > from.y);
    action = forward ? '进' : '退';
    const isDiagonal = (name==='马'||name==='馬'||name==='相'||name==='象'||name==='士'||name==='仕');
    if(isDiagonal){
      target = nums[(side==='RED' ? (9-to.x) : (to.x+1)) - 1];
    }else{
      const steps = Math.abs(to.y - from.y);
      target = nums[steps-1];
    }
  }
  return prefix + filePart + action + target;
}

/* ============================ 走子 ============================ */
function doMove(from, to){
  const side = S.turn;
  const captured = pieceAt(to.x, to.y);
  const notation = notate(from, to);
  const fenBefore = S.game.getCurrentPenCode(side);   // 走这一步之前的局面
  const prevLastMove = S.lastMove;

  const res = S.game.update({x:from.x,y:from.y}, {x:to.x,y:to.y}, side, true);
  if(!res || !res.flag){
    toast((res && res.message) || '这一步走不了');
    return false;
  }
  S.history.push({ fen: fenBefore, side, notation,
                   captured: captured ? captured.name : null, lastMove: prevLastMove });
  S.lastMove = { from:{x:from.x,y:from.y}, to:{x:to.x,y:to.y} };
  S.selected = null;
  S.suggest = null;
  S.turn = other(side);
  render(); refreshUI();
  return true;
}

function sideHasNoMove(side){
  return legalMoves(side).length === 0;
}
function isInCheck(side){
  // 对方（轮到走棋的一方）若能合法吃掉本方将帅，即本方被将军
  const gen = generalOf(side);
  if(!gen) return true;
  const opp = other(side);
  return legalMoves(opp).some(mv => mv.to.x===gen.x && mv.to.y===gen.y);
}

function checkGameEnd(){
  if(!S.game) return false;
  if(!sideHasNoMove(S.turn)){
    return false;
  }
  const winner = other(S.turn);
  const loserInCheck = isInCheck(S.turn);
  const txt = loserInCheck
    ? CN_SIDE[winner] + '胜 —— ' + CN_SIDE[S.turn] + '被将死'
    : CN_SIDE[winner] + '胜 —— ' + CN_SIDE[S.turn] + '无子可动（困毙）';
  $('aiOut').innerHTML = '<b>对局结束</b>\n' + txt;
  toast(txt, 4000);
  refreshUI();
  return true;
}

/* ============================ 用户点击棋盘 ============================ */
function handleClick(x,y){
  if(S.setupMode){ setupPut(x,y); return; }
  if(S.thinking){ toast('军师正在思考…'); return; }
  if(!S.game) return;
  if(sideHasNoMove(S.turn)){ toast('对局已结束，请「新开一局」'); return; }

  const p = pieceAt(x,y);
  if(S.selected){
    if(S.selected.x===x && S.selected.y===y){ S.selected=null; render(); return; }
    // 点到自己另一个子 -> 改选
    if(p && p.side===S.turn){ S.selected={x,y}; render(); return; }
    if(isLegal(S.selected, {x,y})){
      const from = S.selected;
      if(doMove(from, {x,y})) afterMove();
      return;
    }
    toast('这一步不合规则');
    S.selected = null; render(); return;
  }
  if(p && p.side===S.turn){ S.selected={x,y}; render(); }
  else if(p){ toast('现在轮到' + CN_SIDE[S.turn] + '走棋'); }
}

}

function undo(){
  if(!S.history.length || S.thinking) return;
  // 一直回退到「最近一次轮到军师走棋」的局面
  while(S.history.length){
    const h = S.history.pop();
    S.game.setPenCodeList(h.fen);
    S.turn = h.side;
    S.lastMove = h.lastMove || null;
    if(S.turn === S.aiSide) break;
  }
  S.game.changeCurrentPlaySide(S.turn);
  S.selected = null; S.suggest = null;
  $('aiOut').innerHTML = '';
  render(); refreshUI();
  toast('已悔棋');
}

// 统一的对话接口调用；兼容「不支持 response_format 的端点」（自动降级重试）
async function callAI(messages, opts){
  opts = opts || {};
  if(!S.apiKey) throw new Error('请先在「设置」里填写 API Key');
  const url = S.baseUrl.replace(/\/+$/,'') + '/chat/completions';
  const model = opts.model || S.model;

  async function once(useJson){
    const body = { model: model, messages: messages, stream: false };
    if(useJson) body.response_format = { type: 'json_object' };
    if(opts.maxTokens) body.max_tokens = opts.maxTokens;
    if(opts.thinking) body.thinking = { type: opts.thinking };
    if(opts.extra) Object.assign(body, opts.extra);

    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 90000);
    let res;
    try{
      res = await fetch(url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + S.apiKey },
        body: JSON.stringify(body),
        signal: ctrl.signal
      });
    }catch(e){
      clearTimeout(timer);
      if(e.name === 'AbortError') throw new Error('请求超时（90 秒）。可能是网络太慢，或模型思考太久。');
      // fetch 直接失败，通常是页面运行环境不允许联网
      const isFile = location.protocol === 'file:';
      throw new Error(
        '连不上 API。\n' +
        (isFile
          ? '当前是「本地文件」方式打开的，这种页面在手机上（尤其 iPhone）会被浏览器禁止联网。\n' +
            '解决办法：改用 http 地址打开这个页面（见说明），或换到电脑上打开。'
          : '请检查手机网络是否正常、以及「接口地址」是否填对。') +
        '\n原始错误：' + e.message
      );
    }
    clearTimeout(timer);

    if(!res.ok){
      let detail = '';
      try{ const j = await res.json(); detail = (j.error && (j.error.message||j.error.code)) || JSON.stringify(j); }
      catch(e){ try{ detail = (await res.text()).slice(0,300); }catch(e2){} }
      const err = new Error('API ' + res.status + '：' + detail);
      err.status = res.status;
      throw err;
    }
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message;
    if(!msg) throw new Error('返回内容异常：' + JSON.stringify(data).slice(0,200));
    return msg.content || '';
  }

  if(opts.json){
    try{
      return await once(true);
    }catch(e){
      // 部分兼容端点不认 response_format，退回普通模式再试一次
      if(e.status === 400 || e.status === 422 ||
         /response_format|invalid arguments|json_object|unsupported/i.test(e.message||'')){
        return await once(false);
      }
      throw e;
    }
  }
  return await once(false);
}

// 从模型输出里抠出 JSON（容忍 ```json 代码块和前后废话）
function extractJSON(text){
  let s = String(text == null ? '' : text).trim();
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  const i = s.indexOf('{'), j = s.lastIndexOf('}');
  if(i >= 0 && j > i) s = s.slice(i, j + 1);
  return JSON.parse(s);
}

function describeBoardForPrompt(){
  const letter = {
    '帅':'K','仕':'A','相':'B','马':'N','车':'R','炮':'C','兵':'P',
    '将':'k','士':'a','象':'b','馬':'n','車':'r','砲':'c','卒':'p'

/* ---------- Pikafish WASM 引擎管理 ---------- */
// 三件套（pikafish.js/.wasm/.data）放在页面同目录的 pikafish/ 下。
// 主线程负责下载并用 Cache API 缓存，然后 transfer 给 Worker。
const PikaEngine = (() => {
  const BASE = 'pikafish/';
  const FILES = ['pikafish.wasm', 'pikafish.data'];
  const CACHE_NAME = 'pikafish-v1';
  let worker = null;
  let state = 'unloaded';   // unloaded | loading | ready | error
  let readyPromise = null;
  let searchSeq = 0;
  let onInfo = null;        // (info) => void 进度回调
  let pendingResolve = null;

  function status(html){ const el = $('pikaStatus'); if(el) el.innerHTML = html; }

  // 带缓存 + 进度的资源下载
  async function fetchCached(url, onProgress){
    try{
      if(self.caches){
        const cache = await caches.open(CACHE_NAME);
        const hit = await cache.match(url);
        if(hit) return await hit.arrayBuffer();
      }
    }catch(e){ /* 隐私模式下 Cache API 可能不可用，降级直接下载 */ }
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('下载失败 HTTP ' + resp.status);
    let buf;
    const total = +resp.headers.get('Content-Length') || 0;
    if(resp.body && total){
      const reader = resp.body.getReader();
      const chunks = []; let got = 0;
      for(;;){
        const {done, value} = await reader.read();
        if(done) break;
        chunks.push(value); got += value.length;
        if(onProgress) onProgress(got / total);
      }
      buf = await new Blob(chunks).arrayBuffer();
    }else{
      buf = await resp.arrayBuffer();
    }
    try{
      if(self.caches){
        const cache = await caches.open(CACHE_NAME);
        await cache.put(url, new Response(buf.slice(0), {headers:{'Content-Length': String(buf.byteLength)}}));
      }
    }catch(e){ /* 缓存失败不影响使用 */ }
    return buf;
  }

  function initWorker(wasm, data){
    return new Promise((resolve, reject) => {
      let settled = false;
      let w;
      try{ w = new Worker(BASE + 'worker.js'); }
      catch(e){ reject(new Error('无法创建 Worker（本地 file:// 方式请用轻量引擎）')); return; }
      const timer = setTimeout(() => { if(!settled){ settled = true; try{w.terminate();}catch(e){} reject(new Error('引擎初始化超时')); } }, 60000);
      w.onerror = () => { if(!settled){ settled = true; clearTimeout(timer); reject(new Error('引擎加载失败')); } };
      w.onmessage = (e) => {
        const m = e.data;
        if(m.type === 'dbg'){
          (window.__pikaDbg = window.__pikaDbg || []).push(m.msg);
          return;
        }else if(m.type === 'ready' && !settled){
          settled = true; clearTimeout(timer);
          worker = w; state = 'ready';
          resolve();
        }else if(m.type === 'bestmove'){
          if(pendingResolve){
            const r = pendingResolve; pendingResolve = null;
            r(m);
          }
        }else if(m.type === 'info'){
          if(onInfo) onInfo(m);
        }else if(m.type === 'error' && !settled){
          settled = true; clearTimeout(timer); reject(new Error(m.message || '引擎错误'));
        }
      };
      w.postMessage({cmd:'init', wasm, data}, [wasm, data]);
    });
  }

  function ensureReady(){
    if(state === 'ready') return Promise.resolve();
    if(readyPromise) return readyPromise;
    state = 'loading';
    readyPromise = (async () => {
      const bufs = {};
      for(const f of FILES){
        const isBig = f.endsWith('.data');
        bufs[f] = await fetchCached(BASE + f, isBig ? (p => {
          status('Pikafish 神经网络下载中 ' + Math.round(p * 100) + '%（首次下载，之后本地缓存）');
        }) : null);
      }
      status('Pikafish 引擎初始化中…');
      await initWorker(bufs['pikafish.wasm'], bufs['pikafish.data']);
      status('✅ Pikafish 引擎已就绪（超人类棋力，走棋不联网）');
    })();
    readyPromise.catch(err => {
      state = 'error'; readyPromise = null;
      status('⚠️ Pikafish 加载失败：' + esc(String(err.message || err)) + '（自动回退轻量引擎）');
    });
    return readyPromise;
  }

  // 返回 {move:{from,to}|null, score, depth, ms}，score 为轮走方视角（百分兵）
  function search(fen, movetime){
    return new Promise((resolve, reject) => {
      if(state !== 'ready' || !worker){ reject(new Error('Pikafish 未就绪')); return; }
      const id = ++searchSeq;
      const t0 = Date.now();
      let lastInfo = null;
      pendingResolve = (m) => {
        if(m.id !== id){ resolve({ move: null }); return; }
        const out = { ms: Date.now() - t0, move: m.move };
        if(lastInfo){ out.score = lastInfo.score; out.depth = lastInfo.depth; }
        lastInfo = null;
        resolve(out);
      };
      onInfo = (info) => { lastInfo = info; };
      worker.postMessage({cmd:'search', fen, movetime, id});
      // movetime 内必回 bestmove；再加硬超时兜底
      setTimeout(() => {
        if(pendingResolve){ pendingResolve = null; reject(new Error('搜索超时')); }
      }, Math.max(movetime + 25000, 30000));
    });
  }

  return { ensureReady, search, get state(){ return state; } };
})();

/* ---------- 军师想一步 ---------- */
// 内置引擎算棋：0 token、秒出、不会白送子
function engineThink(){
  const fen = currentFen();
  // 收集本局出现过的局面，让引擎避免来回循环
  const avoid = new Set();
  for(const h of S.history){
    if(h.fen) avoid.add(String(h.fen).split(/\s+/).slice(0,2).join(' '));
  }
  const t0 = Date.now();
  const r = Engine.search(fen, { depth: 24, timeMs: S.engineMs, avoid: avoid });
  if(!r) return null;
  const dt = Date.now() - t0;
  // 引擎分值是「轮走方视角」，统一转成红方视角再解读
  const scRed = (S.turn === 'RED' ? r.score : -r.score);
  return { from:{x:r.from.x,y:r.from.y}, to:{x:r.to.x,y:r.to.y},
           score:scRed, depth:r.depth, nodes:r.nodes, ms:dt, evalTxt: evalTextJs(scRed) };
}

// 分值→人话。JS 引擎单位同 VAL（100=1兵），Pikafish 单位是 cp（100cp=1兵）
function evalTextJs(scRed){
  if(Math.abs(scRed) > Engine.MATE - 1000){
    return scRed > 0 ? '军师已算到杀棋' : '局面危险，对方有杀棋';
  }
  const v = scRed / Engine.VAL[7];
  if(Math.abs(v) < 0.5) return '局面基本均势';
  return (v > 0 ? '红方' : '黑方') + '占优，约 ' + Math.abs(v).toFixed(1) + ' 个兵的优势';
}
function evalTextPika(cpRed, isMate){
  if(isMate){
    return (cpRed > 0 ? '军师 ' : '对方 ') + Math.ceil(Math.abs(cpRed)) + ' 步内可杀';
  }
  const v = cpRed / 100;
  if(Math.abs(v) < 0.5) return '局面基本均势';
  return (v > 0 ? '红方' : '黑方') + '占优，约 ' + Math.abs(v).toFixed(1) + ' 个兵的优势';
}

async function thinkOneMove(auto){
  if(S.thinking) return;
  if(sideHasNoMove(S.turn)){ toast('对局已结束'); return; }
  if(S.turn !== S.aiSide){
    toast('现在是' + CN_SIDE[S.turn] + '走棋，等轮到军师再点');
    return;
  }
  S.thinking = true; refreshUI();
  const out = $('aiOut');
  out.innerHTML = '<span class="spin"></span>军师正在思考…';

  let from = null, to = null, autoApply = false;
  let engineName = '轻量引擎';
  try{
    // ---- 1) 引擎算棋（主脑，离线、0 token）----
    let res = null;
    if(S.engineType === 'pika'){
      try{
        await PikaEngine.ensureReady();
        engineName = 'Pikafish';
        out.innerHTML = '<span class="spin"></span>Pikafish 计算中…';
        await new Promise(r => setTimeout(r, 30));
        const r = await PikaEngine.search(currentFen(), S.engineMs);
        if(!r || !r.move) throw new Error('未给出着法');
        // 用规则库验证着法合法性（坐标系换算出错时绝不能落子）
        if(!isLegal(r.move.from, r.move.to)) throw new Error('着法不合法');
        const scRed = (S.turn === 'RED' ? r.score : -r.score);
        res = { from: r.move.from, to: r.move.to, depth: r.depth || 0, ms: r.ms,
                evalTxt: evalTextPika(scRed || 0, !!r.mate) };
      }catch(pe){
        engineName = '轻量引擎';
        toast('Pikafish 不可用（' + String(pe.message || pe).slice(0, 40) + '），已回退轻量引擎');
        res = null;
      }
    }
    if(!res){
      out.innerHTML = '<span class="spin"></span>军师正在思考…（内置引擎计算中）';
      await new Promise(r => setTimeout(r, 30));    // 让 UI 先刷新
      res = engineThink();
      if(!res) throw new Error('这个局面没有可用着法');
    }
    from = res.from; to = res.to;

    S.suggest = { from, to, reason: res.evalTxt };
    const p = pieceAt(from.x, from.y);
    const capPc = pieceAt(to.x, to.y);
    out.innerHTML =
      '<b>军师建议：</b>' + esc(p?p.name:'') + ' ' + notate(from,to) +
      (capPc ? '（吃' + esc(capPc.name) + '）' : '') +
      '　<span class="muted">(' + from.x + ',' + from.y + ' → ' + to.x + ',' + to.y + ')</span>\n' +
      '<span class="muted">[' + esc(engineName) + '] 评估：' + esc(res.evalTxt) +
      '　深度 ' + (res.depth || '?') + '　' + res.ms + 'ms　0 token</span>';
    const btn = document.createElement('button');
    btn.className = 'primary'; btn.textContent = '按军师说的走'; btn.style.marginTop = '8px';
    btn.onclick = ()=>{
      if(S.turn !== S.aiSide){ toast('现在不是军师这一方走棋'); return; }
      if(doMove(from,to)) afterMove();
    };
    out.appendChild(document.createElement('br'));
    out.appendChild(btn);

    // 可选：让大模型补一句「为什么」（要联网、要 token，所以只在配置了 key 时做）
    if(S.wantReason && S.apiKey){
      const line = document.createElement('div');
      line.className = 'muted'; line.style.marginTop = '6px';
      line.textContent = '正在让 AI 补充讲解…';
      out.appendChild(line);
      callAI([{role:'system',content:'你是中国象棋教练。用一句不超过25字的中文，说明这步棋的用意。只输出这句话本身。'},
              {role:'user',content:'局面 FEN：' + currentFen() +
               '\n刚走了：' + notate(from,to) + '（从(' + from.x + ',' + from.y + ')到(' + to.x + ',' + to.y + ')）\n这步棋的用意是什么？'}],
             {maxTokens:2000})
        .then(t => { line.textContent = '讲解：' + String(t).trim().slice(0,60); })
        .catch(e => { line.textContent = '（讲解失败：' + e.message.split('\n')[0] + '）'; });
    }

    render();
    autoApply = !!auto;
  }catch(e){
    out.innerHTML = '<b style="color:#ff8a7a">出错：</b>' + esc(e.message).replace(/\n/g,'<br>');
  }finally{
    S.thinking = false; refreshUI();
  }
  if(autoApply && from && to){
    setTimeout(()=>{
      if(S.turn === S.aiSide && doMove(from,to)) afterMove();
    }, 500);
  }
}

/* ---------- 图片识别录入 ---------- */
function pickImage(mode){
  S.pendingCapture = mode;
  const fi = $('fileInput');
  if(mode === 'environment') fi.setAttribute('capture','environment');
  else fi.removeAttribute('capture');
  fi.value = '';
  fi.click();
}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=>resolve(fr.result);
    fr.onerror = ()=>reject(new Error('读取图片失败'));
    fr.readAsDataURL(file);
  });
}
function compressImage(dataUrl, maxSide){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const k = Math.min(1, maxSide / Math.max(w,h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cx = c.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}
function validateFen(fen){
  const s = String(fen||'').trim().split(/\s+/)[0];
  const rows = s.split('/');
  if(rows.length !== 10) return { ok:false, msg:'需要 10 行，实际 ' + rows.length + ' 行' };
  let redK = 0, blackK = 0, red = 0, black = 0;
  for(const r of rows){
    let n = 0;
    for(const ch of r){
      if(/[1-9]/.test(ch)){ n += +ch; }
      else if(/[KABNRCPkabnrcp]/.test(ch)){
        n++;
        if(ch === 'K') redK++; if(ch === 'k') blackK++;
        if(ch === ch.toUpperCase()) red++; else black++;
      }else return { ok:false, msg:'出现无法识别的字符「' + ch + '」' };
    }
    if(n !== 9) return { ok:false, msg:'第 ' + (rows.indexOf(r)+1) + ' 行是 ' + n + ' 格，应为 9 格' };
  }
  if(redK !== 1 || blackK !== 1) return { ok:false, msg:'必须各有 1 个帅(K)和将(k)' };
  if(red > 16 || black > 16) return { ok:false, msg:'某方棋子超过 16 个' };
  return { ok:true, fen:s, side: (/ b\s*$/.test(String(fen)) ? 'BLACK' : 'RED') };
}
const VISION_LEGEND =
  '棋子字母：大写=红方 K=帅 A=仕 B=相 N=马 R=车 C=炮 P=兵；' +
  '小写=黑方 k=将 a=士 b=象 n=马 r=车 c=炮 p=卒。';

const VISION_PROMPT =
'这是一张中国象棋棋盘图。请识别棋盘上所有棋子的位置。\n' +
'输出方式：正好 10 行，每行正好 9 个字符，从上到下（第 1 行是黑方底线，第 10 行是红方底线），\n' +
'每行从左到右。空位必须写成小数点 . ，不要用数字代替空位。\n' +
VISION_LEGEND + '\n' +
'注意：每行必须恰好 9 个字符，一行一行仔细数，不要跳行，不要漏子，不要多写行。\n' +
'只输出 JSON：{"rows":["第1行9个字符","第2行9个字符","...共10个"],"confidence":"high/medium/low","note":"看不清的地方在这里说明"}';

// 把一行归一化成 9 个字符：数字展开成对应个数的空位，空位统一成 .
// 这样 FEN 风格的 "1cn1c4" 和展开风格的 ".cn.c..." 都能吃
function normalizeRow(row){
  const s = String(row).trim().replace(/\s+/g, '');
  let out = '';
  for(const ch of s){
    if(ch >= '1' && ch <= '9'){ out += '.'.repeat(+ch); }
    else if(ch === '.' || ch === '·' || ch === 'x' || ch === 'X' || ch === '*'){ out += '.'; }
    else { out += ch; }
  }
  return out;
}
// 把 10 行字符网格转成 FEN
function gridToFen(rows){
  const out = [];
  for(const row of rows){
    const r = normalizeRow(row);
    let s = '', n = 0;
    for(const ch of r){
      if(ch === '.'){ n++; continue; }
      if(n){ s += n; n = 0; }
      s += ch;
    }
    if(n) s += n;
    out.push(s);
  }
  return out.join('/');
}
function gridWidthsOk(rows){
  return rows.length === 10 && rows.every(r => normalizeRow(r).length === 9);
}

async function recognizeOnce(small){
  const user = [
    { type:'text', text: VISION_PROMPT },
    { type:'image_url', image_url:{ url: small, detail:'original' } }
  ];
  // 关键：必须开启思考并给足额度，否则模型会直接瞎猜或返回空内容
  const txt = await callAI(
    [{role:'system',content:'你是中国象棋棋谱识别程序。你只输出一个 JSON 对象。'},
     {role:'user',content:user}],
    { json:true, model:S.visionModel || S.model, thinking:'enabled', maxTokens:20000 }
  );
  const obj = extractJSON(txt);
  if(!obj || !Array.isArray(obj.rows)) throw new Error('模型没有返回 rows 数组');
  return obj;
}

async function importFromImage(file){
  if(S.thinking) return;
  S.thinking = true; refreshUI();
  const out = $('aiOut');
  out.innerHTML = '<span class="spin"></span>正在识别图片里的棋盘…（这个模型要思考一会儿，约 1～3 分钟）';
  try{
    const raw = await fileToDataURL(file);
    const small = await compressImage(raw, 1400);

    let obj = null, fen = null, problems = [];
    for(let attempt = 1; attempt <= 2; attempt++){
      out.innerHTML = '<span class="spin"></span>正在识别图片里的棋盘…' +
        (attempt > 1 ? '（第 ' + attempt + ' 次尝试，上次有几行没数对）' : '') +
        '（约 1～3 分钟）';
      obj = await recognizeOnce(small);
      const rows = obj.rows.map(r => String(r).trim());
      if(!gridWidthsOk(rows)){
        problems.push('第 ' + attempt + ' 次：行数 ' + rows.length + '，每行长度 ' + rows.map(r=>r.length).join(','));
        continue;
      }
      const cand = gridToFen(rows);
      const v = validateFen(cand + ' w');
      if(!v.ok){ problems.push('第 ' + attempt + ' 次：' + v.msg); continue; }
      fen = v.fen;
      break;
    }
    if(!fen) throw new Error('识别结果不合法。' + problems.join('；'));

    const turn = S.turn;   // 图片看不出轮到谁，保持当前走子方
    S.game.setPenCodeList(fen + ' ' + (turn === 'RED' ? 'w' : 'b'));
    S.game.changeCurrentPlaySide(turn);
    S.selected = null; S.lastMove = null; S.suggest = null; S.history = [];
    render(); refreshUI();

    out.innerHTML = '<b>已按图片载入局面。</b>识别置信度：' + esc(obj.confidence || '未知') +
      '\nFEN：' + esc(fen) +
      (obj.note ? '\n说明：' + esc(obj.note) : '') +
      '\n<span style="color:#f0c46a">务必对照真实棋盘逐行核对！实测这个模型会漏子或整体错位，' +
      '而且错了也会说「高置信度」。</span>';
    const fix = document.createElement('button');
    fix.className = 'primary'; fix.textContent = '有错，去修正'; fix.style.marginTop = '8px';
    fix.onclick = ()=>{ setupEnter(); };
    out.appendChild(document.createElement('br'));
    out.appendChild(fix);
    render();
  }catch(e){
    out.innerHTML = '<b style="color:#ff8a7a">识别失败：</b>' + esc(e.message).replace(/\n/g,'<br>') +
      '\n<span class="muted">如果反复失败，可以直接手动点棋盘把局面摆出来，然后开始对局。</span>';
  }finally{
    S.thinking = false; refreshUI();
  }
}

  loadCfgSync();

  $('setKey').value = S.apiKey;
  $('setModel').value = S.model;
  $('setVision').value = S.visionModel;
  $('setBase').value = S.baseUrl;
  $('setSide').value = S.aiSide;
  $('setStrength').value = String(S.engineMs);
  $('setEngine').value = S.engineType;
  if(S.engineType === 'pika') PikaEngine.ensureReady();
  $('autoAI').checked = S.autoAI;
  if(!S.hasFlipCfg) orientToAiSide();     // 首次使用：按执方摆正视角
  newGame();
  setTimeout(render, 60);
  // 本地文件方式打开时，提示联网风险
  if(location.protocol === 'file:'){
    const w = document.createElement('div');
    w.className = 'banner';
    w.innerHTML = '你是用「本地文件」方式打开的。电脑上一般没问题，' +
      '但<b>手机上（尤其 iPhone）浏览器可能禁止这种页面联网</b>，AI 会报错。' +
      '若 AI 用不了，改用 http 地址打开即可。';
    document.querySelector('.top').insertAdjacentElement('afterend', w);
  }
}
